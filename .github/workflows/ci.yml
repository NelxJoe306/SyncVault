name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build with Maven
        run: mvn -B package

      - name: Run integration tests
        run: bash scripts/run-integration-tests.sh

      - name: Benchmark harness smoke
        run: BENCH_REBUILD=0 bash scripts/bench.sh --smoke
